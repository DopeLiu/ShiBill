name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 刻意不使用 android-actions/setup-android@v3：
      # 该 action 默认执行 `sdkmanager tools`，而 Android SDK 仓库已移除 `tools` 包
      # （被 `cmdline-tools` 取代），必然报 "Failed to find package 'tools'" 并使整个作业失败。
      # ubuntu-latest 运行器本身已预装 Android SDK：ANDROID_HOME=/usr/local/lib/android/sdk，
      # 内含 platforms;android-35 与本项目所需 build-tools，环境变量也已就绪，无需再装。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | sort -V | tail -3
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -3

      - name: Prepare signing config
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "storeFile=release.keystore" >> keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
